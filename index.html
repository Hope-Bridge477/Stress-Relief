<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeSpace | Your Stress Relief Companion</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --accent-color: #6c63ff;
            --text-color: #2d3436;
            --secondary-text: #636e72;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            transition: background 0.5s ease;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--accent-color);
        }

        p.subtitle {
            color: var(--secondary-text);
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            border: 2px solid #dfe6e9;
            border-radius: 12px;
            resize: none;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        textarea:focus {
            border-color: var(--accent-color);
        }

        button {
            margin-top: 20px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
        }

        button:hover {
            background-color: #5a52d5;
            transform: translateY(-2px);
        }

        #response-area {
            margin-top: 30px;
            padding: 20px;
            border-radius: 12px;
            background: #f9f9ff;
            display: none;
            animation: fadeIn 0.8s ease;
        }

        .motivation-text {
            font-style: italic;
            line-height: 1.6;
            color: #4834d4;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .breathing-circle {
            width: 10px;
            height: 10px;
            background: var(--accent-color);
            border-radius: 50%;
            margin: 20px auto;
            animation: breathe 4s infinite ease-in-out;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(5); opacity: 0.1; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>SafeSpace</h1>
    <p class="subtitle">Whatever is on your mind, let it out here. This is a private space for you.</p>
    
    <textarea id="user-input" placeholder="Tell me what's bothering you..."></textarea>
    
    <br>
    <button onclick="provideRelief()">I need a moment of peace</button>

    <div id="response-area">
        <div class="breathing-circle"></div>
        <p id="output-text" class="motivation-text"></p>
        <button onclick="resetSpace()" style="background: #b2bec3; margin-top: 15px; font-size: 0.8rem;">Clear My Mind</button>
    </div>
</div>

<script>
    const database = {
        anxiety: [
            "Take a deep breath. You've survived 100% of your hardest days so far.",
            "You don't have to figure out your whole life right now. You just need to get through the next hour.",
            "Anxiety is a liar. It makes things look bigger than they are. You are stronger than this feeling."
        ],
        work: [
            "Your productivity does not define your worth as a human being.",
            "It's okay to step back. The world won't collapse if you take a break.",
            "You are doing your best, and that is enough. Rest is a part of the process, not a reward."
        ],
        sadness: [
            "It's okay to not be okay. Healing isn't a straight line.",
            "Be gentle with yourself. You are growing through what you are going through.",
            "This feeling is a tunnel, not a cave. There is light at the other end, even if you can't see it yet."
        ],
        generic: [
            "Close your eyes for ten seconds. Inhale for 4, hold for 4, exhale for 4. You are here. You are safe.",
            "You are worthy of peace and happiness, no matter what happened today.",
            "Small steps still move you forward. Be proud of yourself for just being here."
        ]
    };

    function provideRelief() {
        const input = document.getElementById('user-input').value.toLowerCase();
        const outputArea = document.getElementById('response-area');
        const outputText = document.getElementById('output-text');
        
        if (input.trim() === "") {
            alert("Please share a few words so I can help.");
            return;
        }

        let category = 'generic';

        if (input.includes('work') || input.includes('study') || input.includes('job') || input.includes('boss')) {
            category = 'work';
        } else if (input.includes('scared') || input.includes('anxious') || input.includes('worry') || input.includes('panic')) {
            category = 'anxiety';
        } else if (input.includes('sad') || input.includes('cry') || input.includes('alone') || input.includes('hurt')) {
            category = 'sadness';
        }

        const responses = database[category];
        const randomResponse = responses[Math.floor(Math.random() * responses.length)];

        outputText.innerText = randomResponse;
        outputArea.style.display = 'block';
        
        // Soften the UI
        document.body.style.backgroundColor = "#dff9fb";
    }

    function resetSpace() {
        document.getElementById('user-input').value = "";
        document.getElementById('response-area').style.display = 'none';
        document.body.style.backgroundColor = "#f0f4f8";
    }
</script>

</body>
</html>
