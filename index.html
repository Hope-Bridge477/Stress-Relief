<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sōzen | The Art of Release</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:italic,wght@0,300;1,300&family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1a1a1a;
            --soft-blue: #e2e8f0;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000; /* Deep focus background */
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* The Liquid Aura - Animated Background */
        .aura-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, #1e293b 0%, #000 100%);
            z-index: -1;
        }

        .blob {
            position: absolute;
            width: 600px;
            height: 600px;
            background: linear-gradient(135deg, rgba(148, 163, 184, 0.2) 0%, rgba(30, 41, 59, 0.2) 100%);
            filter: blur(80px);
            border-radius: 50%;
            animation: move 20s infinite alternate;
            z-index: -1;
        }

        @keyframes move {
            from { transform: translate(-10%, -10%); }
            to { transform: translate(20%, 20%); }
        }

        .serif { font-family: 'Cormorant Garamond', serif; }

        /* Elegant Container */
        .zen-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 4rem;
            border-radius: 100px 100px 0 0; /* Modern Architectural Shape */
            text-align: center;
            width: 100%;
            max-width: 800px;
            transition: all 1.5s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .input-area {
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            width: 100%;
            color: #fff;
            font-size: 1.5rem;
            padding: 1rem;
            text-align: center;
            outline: none;
            transition: border-color 0.8s;
        }

        .input-area:focus {
            border-bottom: 1px solid rgba(255, 255, 255, 0.8);
        }

        /* Button Styling */
        .btn-zen {
            margin-top: 3rem;
            padding: 1.2rem 3rem;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: transparent;
            color: white;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.5s;
        }

        .btn-zen:hover {
            background: #fff;
            color: #000;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
        }

        /* Hidden Class for Transitions */
        .hidden-element {
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
        }

        .reveal {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="aura-bg">
        <div class="blob" style="top: 10%; left: 10%;"></div>
        <div class="blob" style="bottom: 10%; right: 10%; animation-delay: -5s;"></div>
    </div>

    <div id="main-container" class="zen-card">
        <div id="prompt-view">
            <h2 class="text-xs tracking-[0.5em] uppercase text-slate-400 mb-8 font-light">The Quiet Space</h2>
            <h1 class="serif text-5xl md:text-7xl italic font-light mb-12">Leave your <span class="font-normal">burden</span> here.</h1>
            
            <textarea id="userInput" class="serif input-area" placeholder="What is heavy on your soul?"></textarea>
            
            <button onclick="transformEnergy()" class="btn-zen">Exhale</button>
        </div>

        <div id="response-view" class="hidden-element absolute inset-0 flex flex-col items-center justify-center p-12 text-center">
            <h3 id="wisdom-text" class="serif text-4xl md:text-5xl italic leading-relaxed text-slate-200"></h3>
            <div class="w-12 h-[1px] bg-white/30 my-10"></div>
            <button onclick="resetSpace()" class="text-[0.6rem] tracking-[0.4em] uppercase text-slate-500 hover:text-white transition-all">Dissolve</button>
        </div>
    </div>

    <footer class="fixed bottom-8 text-[0.6rem] tracking-[0.6em] uppercase text-slate-600">
        Sōzen &bull; Mindful Architecture
    </footer>

    <script>
        const teachings = [
            "You are the sky. The thoughts are just weather.",
            "If it is out of your hands, it deserves a freedom from your mind.",
            "You do not have to be 'okay' to be worthy of peace.",
            "The stars can only shine because of the darkness you fear.",
            "In the middle of movement and chaos, keep stillness inside of you.",
            "Your strength is not in how much you carry, but in what you let go."
        ];

        function transformEnergy() {
            const input = document.getElementById('userInput').value;
            if (!input.trim()) return;

            const promptView = document.getElementById('prompt-view');
            const responseView = document.getElementById('response-view');
            const wisdomText = document.getElementById('wisdom-text');
            const container = document.getElementById('main-container');

            // Phase 1: Dissolve the input
            promptView.style.transition = "all 1s ease";
            promptView.classList.add('hidden-element');

            // Phase 2: Transform the card
            setTimeout(() => {
                promptView.style.display = "none";
                responseView.style.position = "relative";
                responseView.classList.add('reveal');
                
                // Set the wisdom
                wisdomText.innerText = teachings[Math.floor(Math.random() * teachings.length)];
            }, 1000);
        }

        function resetSpace() {
            const container = document.getElementById('main-container');
            container.style.opacity = "0";
            setTimeout(() => {
                location.reload();
            }, 800);
        }

        // Mouse interaction for Aura
        document.addEventListener('mousemove', (e) => {
            const blobs = document.querySelectorAll('.blob');
            const x = (e.clientX / window.innerWidth) * 50;
            const y = (e.clientY / window.innerHeight) * 50;
            blobs.forEach(b => {
                b.style.transform = `translate(${x}px, ${y}px)`;
            });
        });
    </script>
</body>
</html>
