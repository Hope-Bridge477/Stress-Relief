<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sōzen | Chromatic Peace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:italic,wght@0,300;1,300&family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            /* Animated Gradient Background */
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #312e81, #1e293b);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .serif { font-family: 'Cormorant Garamond', serif; }

        /* Glowing Orbs */
        .orb {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(100px);
            z-index: -1;
            opacity: 0.6;
            animation: float 20s infinite alternate;
        }
        .orb-1 { background: #818cf8; top: -10%; left: -10%; }
        .orb-2 { background: #2dd4bf; bottom: -10%; right: -10%; animation-delay: -5s; }
        .orb-3 { background: #c084fc; top: 40%; right: 20%; animation-delay: -10s; }

        @keyframes float {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(100px, 50px) scale(1.2); }
        }

        /* Glass Container with Color-Border */
        .zen-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 5rem 3rem;
            border-radius: 40px;
            text-align: center;
            width: 90%;
            max-width: 750px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        /* Input highlight color */
        .input-area {
            background: transparent;
            border: none;
            border-bottom: 2px solid rgba(45, 212, 191, 0.3);
            width: 100%;
            color: #f0f9ff;
            font-size: 1.8rem;
            padding: 1rem;
            text-align: center;
            outline: none;
            transition: all 0.5s;
        }

        .input-area:focus {
            border-bottom: 2px solid #2dd4bf;
            text-shadow: 0 0 10px rgba(45, 212, 191, 0.5);
        }

        /* Button with dynamic color */
        .btn-zen {
            margin-top: 3rem;
            padding: 1rem 4rem;
            border-radius: 50px;
            background: linear-gradient(90deg, #2dd4bf, #818cf8);
            color: #000;
            text-transform: uppercase;
            letter-spacing: 5px;
            font-size: 0.75rem;
            font-weight: 800;
            cursor: pointer;
            border: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-zen:hover {
            transform: scale(1.05) translateY(-5px);
            box-shadow: 0 15px 30px rgba(45, 212, 191, 0.4);
            letter-spacing: 7px;
        }

        .wisdom-gradient {
            background: linear-gradient(to right, #f0f9ff, #2dd4bf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>

    <!-- Animated Color Orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div id="main-container" class="zen-card">
        <div id="prompt-view" class="transition-all duration-1000">
            <h2 class="text-[0.6rem] tracking-[0.8em] uppercase text-teal-300 mb-6 font-bold">Atmospheric Relief</h2>
            <h1 class="serif text-5xl md:text-6xl italic font-light mb-12 leading-tight">
                Release your <span class="text-teal-200">tension</span> into the light.
            </h1>
            
            <textarea id="userInput" class="serif input-area" placeholder="What is clouding your mind?"></textarea>
            
            <button onclick="transformEnergy()" class="btn-zen">Exhale</button>
        </div>

        <div id="response-view" class="hidden opacity-0 translate-y-10 transition-all duration-1000 flex flex-col items-center">
            <h3 id="wisdom-text" class="serif text-4xl md:text-5xl italic leading-relaxed wisdom-gradient"></h3>
            <div class="w-20 h-[2px] bg-gradient-to-right from-teal-400 to-indigo-400 my-12"></div>
            <button onclick="resetSpace()" class="text-[0.7rem] tracking-[0.5em] uppercase text-teal-200 hover:text-white transition-all font-bold">Begin New Cycle</button>
        </div>
    </div>

    <script>
        const teachings = [
            "Your breath is an anchor in this colorful world.",
            "Let the heavy thoughts dissolve like clouds in a blue sky.",
            "You are not your stress; you are the one observing it.",
            "Peace is not the absence of storm, but the calm within it.",
            "Allow yourself to bloom at your own pace.",
            "Every sunset is an opportunity to reset your soul."
        ];

        function transformEnergy() {
            const input = document.getElementById('userInput').value;
            if (!input.trim()) return;

            const promptView = document.getElementById('prompt-view');
            const responseView = document.getElementById('response-view');
            const wisdomText = document.getElementById('wisdom-text');

            // Fade out
            promptView.classList.add('opacity-0', 'translate-y-[-20px]');
            
            setTimeout(() => {
                promptView.classList.add('hidden');
                responseView.classList.remove('hidden');
                
                // Show message
                wisdomText.innerText = teachings[Math.floor(Math.random() * teachings.length)];
                
                // Fade in
                setTimeout(() => {
                    responseView.classList.remove('opacity-0', 'translate-y-10');
                }, 50);
            }, 800);
        }

        function resetSpace() {
            document.getElementById('main-container').style.opacity = "0";
            setTimeout(() => { location.reload(); }, 500);
        }
    </script>
</body>
</html>
