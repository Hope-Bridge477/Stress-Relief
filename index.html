<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeSpace AI | Stress Relief</title>
    <!-- Puter.js is the AI "Brain" for this website -->
    <script src="https://js.puter.com/v2/"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #eef2f7;
            --card-bg: #ffffff;
            --accent-color: #6c63ff;
            --text-color: #2d3436;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            transition: background 1s ease;
        }

        .container {
            width: 90%;
            max-width: 550px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            text-align: center;
        }

        h1 { font-weight: 600; color: var(--accent-color); margin-bottom: 10px; }
        p.desc { font-size: 0.9rem; color: #636e72; margin-bottom: 25px; }

        textarea {
            width: 100%;
            height: 120px;
            padding: 15px;
            border: 2px solid #edeff2;
            border-radius: 15px;
            resize: none;
            font-family: inherit;
            outline: none;
            transition: 0.3s;
        }

        textarea:focus { border-color: var(--accent-color); }

        .btn-ai {
            margin-top: 20px;
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-ai:hover { opacity: 0.9; transform: scale(1.02); }

        #response-box {
            margin-top: 30px;
            padding: 20px;
            border-radius: 15px;
            background: #f8f9ff;
            display: none;
            border-left: 5px solid var(--accent-color);
            text-align: left;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .breathe-indicator {
            width: 12px;
            height: 12px;
            background: var(--accent-color);
            border-radius: 50%;
            margin: 0 auto 15px;
            animation: pulse 4s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(4); opacity: 0.1; }
        }

        .loading-text { font-size: 0.8rem; color: var(--accent-color); font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>SafeSpace AI</h1>
    <p class="desc">The world is loud. This space is quiet. Tell me what's on your mind.</p>
    
    <textarea id="user-input" placeholder="Type your worries here..."></textarea>
    
    <button class="btn-ai" id="submit-btn" onclick="askAI()">Talk to AI</button>

    <div id="response-box">
        <div class="breathe-indicator"></div>
        <p id="ai-output" style="line-height: 1.6;"></p>
    </div>
</div>

<script>
    async function askAI() {
        const input = document.getElementById('user-input').value;
        const outputBox = document.getElementById('response-box');
        const outputText = document.getElementById('ai-output');
        const btn = document.getElementById('submit-btn');

        if (!input.trim()) {
            alert("Please share something so I can help.");
            return;
        }

        // Show loading state
        btn.disabled = true;
        btn.innerText = "Listening...";
        outputText.innerHTML = '<span class="loading-text">The AI is thinking of a peaceful response for you...</span>';
        outputBox.style.display = 'block';

        try {
            // This is the AI call
            const response = await puter.ai.chat(
                `The user is feeling stressed and said: "${input}". 
                Respond as a warm, wise, and comforting life coach. 
                Keep it to 2-3 sentences. End with a very short stress-relief 
                tip like a breathing exercise or a grounding technique.`
            );

            outputText.innerText = response;
            document.body.style.backgroundColor = "#e8f4f8"; // Change color on success
        } catch (error) {
            outputText.innerText = "I'm here for you, but my AI brain is a bit tired. Take a deep breath and remember that this feeling is temporary.";
        } finally {
            btn.disabled = false;
            btn.innerText = "Talk to AI";
        }
    }
</script>

</body>
</html>
