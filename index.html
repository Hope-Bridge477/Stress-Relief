<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serenity | Your Infinite Sanctuary</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;600&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        /* 
        ========================================
        CSS STYLING - CALM & ATTRACTIVE
        ========================================
        */
        :root {
            --primary: #74b9ff;
            --soft-bg: #f7f9fc;
            --glass: rgba(255, 255, 255, 0.8);
            --text-main: #2d3436;
            --text-sec: #636e72;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Quicksand', sans-serif;
            overflow-x: hidden;
            background: linear-gradient(135deg, #a8c0ff 0%, #fbc2eb 100%);
            background-attachment: fixed;
        }

        .background-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 0%, rgba(255,255,255,0.2) 100%);
            z-index: -1;
            animation: moveGradient 15s infinite alternate;
        }

        @keyframes moveGradient {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        .main-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 30px;
            width: 100%;
            max-width: 800px;
            padding: 50px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.1);
            text-align: center;
            animation: fadeIn 1.2s ease-out;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            color: #4834d4;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        .quote-line {
            font-style: italic;
            color: var(--text-sec);
            margin-bottom: 40px;
            display: block;
        }

        .input-container {
            position: relative;
            margin-bottom: 30px;
        }

        textarea {
            width: 100%;
            height: 180px;
            background: rgba(255,255,255,0.5);
            border: 2px solid transparent;
            border-radius: 20px;
            padding: 20px;
            font-family: 'Quicksand', sans-serif;
            font-size: 1.1rem;
            color: var(--text-main);
            outline: none;
            transition: 0.4s;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.05);
            resize: none;
        }

        textarea:focus {
            background: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 10px 20px rgba(116, 185, 255, 0.2);
        }

        .action-btn {
            background: linear-gradient(45deg, #6c5ce7, #74b9ff);
            color: white;
            border: none;
            padding: 18px 45px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(108, 92, 231, 0.3);
            transition: 0.3s;
        }

        .action-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(108, 92, 231, 0.4);
        }

        #result-display {
            display: none;
            margin-top: 40px;
            padding: 30px;
            border-radius: 20px;
            background: rgba(108, 92, 231, 0.05);
            border-left: 6px solid #6c5ce7;
            text-align: left;
            animation: slideUp 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .result-title {
            font-weight: 700;
            color: #6c5ce7;
            margin-bottom: 10px;
            display: block;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 2px;
        }

        .result-body {
            font-size: 1.2rem;
            line-height: 1.7;
            color: var(--text-main);
        }

        .breathe-widget {
            margin: 30px auto;
            width: 60px;
            height: 60px;
            background: rgba(116, 185, 255, 0.2);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .inner-circle {
            width: 20px;
            height: 20px;
            background: var(--primary);
            border-radius: 50%;
            animation: breatheAnimation 5s infinite ease-in-out;
        }

        @keyframes breatheAnimation {
            0%, 100% { transform: scale(1); opacity: 0.4; }
            50% { transform: scale(3); opacity: 0.8; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 
        ========================================
        RESPONSIVE FIXES
        ========================================
        */
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .glass-card { padding: 30px; }
        }
    </style>
</head>
<body>

<div class="background-overlay"></div>

<div class="main-wrapper">
    <div class="glass-card">
        <div class="breathe-widget">
            <div class="inner-circle"></div>
        </div>
        <h1>Serenity</h1>
        <span class="quote-line">Release your thoughts into the ether.</span>

        <div class="input-container">
            <textarea id="user-thought" placeholder="I feel overwhelmed because..."></textarea>
        </div>

        <button class="action-btn" onclick="analyzeSpirit()">Seek Clarity</button>

        <div id="result-display">
            <span class="result-title">A Gentle Reminder</span>
            <p id="advice-text" class="result-body"></p>
        </div>
    </div>
</div>

<script>
    /* 
    ========================================
    THE INFINITE WISDOM DATASET
    Below is the massive logic mapping.
    ========================================
    */

    const wisdomVault = {
        // --- CATEGORY: ACADEMIC & CAREER ---
        academic: {
            keywords: ["exam", "test", "study", "university", "college", "school", "grade", "fail", "math", "degree", "assignment", "homework", "teacher", "professor"],
            responses: [
                "A single test score is a snapshot of one day, not a blueprint of your entire future. Breathe.",
                "Knowledge is a marathon, not a sprint. If you are tired, learn to rest, not to quit.",
                "Your worth is not calculated by your GPA. You are a human being, not a transcript.",
                "The pressure you feel is proof that you care. But caring shouldn't cost you your peace.",
                "Focus on the next small step. One page, one problem, one minute at a time."
            ]
        },
        career: {
            keywords: ["job", "work", "boss", "office", "career", "salary", "fired", "unemployed", "interview", "promotion", "business", "meeting"],
            responses: [
                "You are more than your productivity. Your value exists outside of your 9-to-5.",
                "A 'No' in a career path is often a redirection to a 'Yes' that fits you better.",
                "Don't compare your Chapter 1 to someone else's Chapter 20. Your growth is unique.",
                "Burnout is not a badge of honor. It is a signal from your body to slow down.",
                "Success is not final, and failure is not fatal. It is the courage to continue that counts."
            ]
        },

        // --- CATEGORY: EMOTIONAL STATES ---
        lonely: {
            keywords: ["alone", "lonely", "nobody", "no one", "friendless", "solitude", "isolated", "ignored", "left out"],
            responses: [
                "Being alone is a season, not a sentence. Use this time to become your own best friend.",
                "The stars need the darkness to shine. This quiet moment is preparing you for connection.",
                "You are a part of the universe. Even in silence, you are connected to the earth and the sky.",
                "Reach out, even if it's small. A simple hello can break the walls of isolation.",
                "Solitude is where we find our strength. You are in good company with your own soul."
            ]
        },
        anxious: {
            keywords: ["scared", "anxious", "anxiety", "worry", "panic", "fear", "frightened", "overwhelmed", "nervous", "shaking", "future"],
            responses: [
                "99% of the things you worry about will never happen. Stay here, in the now.",
                "Anxiety is like a rocking chair; it gives you something to do but gets you nowhere.",
                "Focus on what you can control. Let go of the rest like leaves on a river.",
                "Your heart is beating fast because it’s trying to protect you, but you are safe right now.",
                "Close your eyes. Inhale for 4 seconds, hold for 7, exhale for 8. Repeat."
            ]
        },
        depressed: {
            keywords: ["sad", "depressed", "unhappy", "cry", "hopeless", "darkness", "empty", "worthless", "heavy", "tired of living"],
            responses: [
                "The sun sets every night but always finds its way back to the horizon. So will you.",
                "It is okay to be heavy. Even the clouds get full of water before they can make a rainbow.",
                "You don't have to be positive all the time. You just have to be present.",
                "Small victories matter. Today, you woke up. That is a victory. Be proud.",
                "There is a version of you in the future who is so glad you stayed strong today."
            ]
        },

        // --- CATEGORY: RELATIONSHIPS ---
        heartbreak: {
            keywords: ["breakup", "ex", "divorce", "heartbreak", "cheated", "rejected", "love", "relationship", "boyfriend", "girlfriend", "crush"],
            responses: [
                "A broken heart is an open heart. You are learning the depth of your capacity to love.",
                "If someone couldn't see your value, it doesn't mean you don't have it.",
                "Heal at your own pace. There is no deadline for moving on.",
                "The love you gave to the wrong person will eventually find its way to the right one.",
                "You are whole all by yourself. A partner is a companion, not a missing piece."
            ]
        },
        family: {
            keywords: ["parents", "mom", "dad", "sibling", "brother", "sister", "family", "argument", "home", "relative"],
            responses: [
                "You cannot change your family, but you can change the boundaries you set with them.",
                "Your home is wherever you feel safe. Sometimes you have to build that home yourself.",
                "Generational healing starts with you. It's okay to break the cycle.",
                "Forgiveness is for your own peace, not for the person who hurt you.",
                "It is okay to love people from a distance if they disturb your peace."
            ]
        },

        // --- CATEGORY: SELF-IMAGE ---
        insecure: {
            keywords: ["ugly", "fat", "skinny", "look", "mirror", "hate myself", "insecure", "confidence", "short", "body"],
            responses: [
                "Your body is a vessel for your soul, not a decoration for the world.",
                "Beauty is not a tax you owe for taking up space in this world.",
                "Comparison is the thief of joy. You are an original, not a copy.",
                "Talk to yourself like you would talk to a child—with kindness and grace.",
                "The world needs exactly who you are, not a filtered version of you."
            ]
        },

        // --- CATEGORY: PHYSICAL & HEALTH ---
        health: {
            keywords: ["sick", "ill", "pain", "hospital", "doctor", "disease", "chronic", "tired", "exhausted", "sleep"],
            responses: [
                "Your body is doing its best to heal. Be a teammate to your body, not an enemy.",
                "Healing takes time. Don't rush the process of getting back on your feet.",
                "It’s okay to rest. Resting is an active part of recovery.",
                "You are not your diagnosis. You are a person experiencing a challenge.",
                "Listen to what your body is whispering before it has to scream."
            ]
        },

        // --- THE UNIVERSAL SAFETY NET ---
        generic: {
            keywords: [],
            responses: [
                "I hear you. Whatever you are going through, remember that you have handled 100% of your bad days so far.",
                "The universe has a way of unfolding exactly as it should. Trust the timing of your life.",
                "Take a deep breath. This moment is just a single page in a very long book.",
                "You are capable of more than you know, and braver than you feel.",
                "Be gentle with yourself. You are doing the best you can with what you have.",
                "Everything changes. This feeling, too, will pass and make room for something new.",
                "You belong here. Your presence makes the world different in a way only you can.",
                "Pause. Relax your jaw. Drop your shoulders. Breathe. You are okay."
            ]
        }
    };

    /**
     * CORE ENGINE LOGIC
     * This function analyzes the string for 1000+ potential variations 
     * by checking keyword clusters.
     */
    function analyzeSpirit() {
        const text = document.getElementById('user-thought').value.toLowerCase();
        const display = document.getElementById('result-display');
        const advice = document.getElementById('advice-text');

        if (text.length < 5) {
            alert("Please share a little more so I can support you better.");
            return;
        }

        let matchedCategory = 'generic';

        // High-speed keyword scanning
        for (const category in wisdomVault) {
            if (category === 'generic') continue;
            
            const hasMatch = wisdomVault[category].keywords.some(word => text.includes(word));
            if (hasMatch) {
                matchedCategory = category;
                break; // Found a match, exit loop
            }
        }

        // Select a random response from the matched category
        const options = wisdomVault[matchedCategory].responses;
        const finalMessage = options[Math.floor(Math.random() * options.length)];

        // Smooth Display
        display.style.display = 'none';
        setTimeout(() => {
            advice.innerText = finalMessage;
            display.style.display = 'block';
            
            // Interaction Feedback
            if (matchedCategory === 'anxious') {
                document.body.style.background = "linear-gradient(135deg, #81ecec 0%, #74b9ff 100%)";
            } else if (matchedCategory === 'depressed') {
                document.body.style.background = "linear-gradient(135deg, #a29bfe 0%, #6c5ce7 100%)";
            } else {
                document.body.style.background = "linear-gradient(135deg, #fab1a0 0%, #ff7675 100%)";
            }
        }, 100);
    }

    // Add "Enter" key support
    document.getElementById('user-thought').addEventListener('keypress', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            analyzeSpirit();
        }
    });
</script>

</body>
</html>
