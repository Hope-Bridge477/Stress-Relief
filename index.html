<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serenity | Relief</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; font-family: sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body class="flex items-center justify-center p-6">
    <div class="glass max-w-xl w-full rounded-3xl p-8 shadow-2xl">
        <h1 class="text-3xl font-light text-slate-700 mb-2">Serenity</h1>
        <p class="text-slate-500 mb-6 italic">What is on your mind? We are listening.</p>
        
        <textarea id="userInput" class="w-full h-40 p-4 rounded-xl border-none shadow-inner mb-4 focus:ring-2 focus:ring-slate-300 outline-none" placeholder="Share your thoughts..."></textarea>
        
        <div class="flex justify-between items-center">
            <span id="status" class="text-sm text-slate-400"></span>
            <button onclick="getRelief()" id="sendBtn" class="bg-slate-700 text-white px-8 py-2 rounded-full hover:bg-slate-800 transition-all">Exhale</button>
        </div>

        <div id="resultBox" class="hidden mt-8 p-6 bg-white/50 rounded-xl border border-white">
            <p id="aiResponse" class="text-slate-700 leading-relaxed italic text-lg"></p>
            <button onclick="window.location.reload()" class="mt-4 text-xs text-slate-400 underline">Start Again</button>
        </div>
    </div>

    <script>
        async function getRelief() {
            const input = document.getElementById('userInput').value;
            const status = document.getElementById('status');
            const resultBox = document.getElementById('resultBox');
            const aiResponse = document.getElementById('aiResponse');
            const sendBtn = document.getElementById('sendBtn');

            if (!input) return;

            status.innerText = "Listening...";
            sendBtn.disabled = true;

            try {
                // This connects to the folder you created in GitHub
                const response = await fetch('/api/relief', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: input })
                });

                const data = await response.json();
                
                resultBox.classList.remove('hidden');
                aiResponse.innerText = data.reply;
                status.innerText = "";
            } catch (error) {
                aiResponse.innerText = "I'm here for you, but my connection is weak. Take a deep breath.";
                resultBox.classList.remove('hidden');
                status.innerText = "";
            } finally {
                sendBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
